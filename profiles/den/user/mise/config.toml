[tools]
"aqua:VirusTotal/vt-cli" = "latest"
"aqua:bahdotsh/wrkflw" = "latest"
"aqua:gokcehan/lf" = "latest"
"aqua:showwin/speedtest-go" = "latest"
"github:Y2Z/monolith" = "latest"
"github:bugzmanov/bookokrat" = "latest"
"github:matthart1983/netwatch" = "latest"
"github:mroboff/vm-curator" = "latest"
"github:riii111/sabiql" = "latest"
"github:rogue-sly/dotbee" = "latest"
"github:scipenai/tylax" = "latest"
gopass = "latest"
opencode = "latest"
usql = "latest"

[settings]
auto_install = true
lockfile = true
lockfile_platforms = ["linux-x64"]
# minimum_release_age = "7d"
disable_tools = [
  "dotnet",
  "node",
  "rust",
  "uv",
]

# backends
cargo = { binstall = true }
npm = { package_manager = "npm" }
pipx = { uvx = true }
