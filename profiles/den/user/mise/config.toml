[tools]
"aqua:bahdotsh/wrkflw" = "latest"
"aqua:gokcehan/lf" = "latest"
"aqua:showwin/speedtest-go" = "latest"
bat = "latest"
bat-extras = "latest"
delta = "latest"
"github:RivoLink/leaf" = "latest"
"github:Y2Z/monolith" = "latest"
"github:al13n321/nnd" = "latest"
"github:matthart1983/netwatch" = "latest"
"github:mroboff/vm-curator" = "latest"
"github:rogue-sly/dotbee" = "latest"
"github:scipenai/tylax" = "latest"
gopass = "latest"
"llama.cpp" = { version = "latest", prerelease = true, version_prefix = "b" }
llmfit = "latest"
opencode = "latest"
rclone = "latest"
tealdeer = "latest"
trufflehog = "latest"
typst = "latest"
typstyle = "latest"
usql = "latest"
zoxide = "latest"

[settings]
auto_install = true
lockfile = true
activate_shims = false
# minimum_release_age = "7d"
disable_tools = ["dotnet", "node", "rust", "uv"]
# fuck you npm
disable_backends = ["npm"]

# backends
cargo = { binstall = true }
pipx = { uvx = true }
github = { credential_command = "mise x -- gopass show keys/github" }
