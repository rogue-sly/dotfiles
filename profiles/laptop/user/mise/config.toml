[tools]
"github:RivoLink/leaf" = "latest"
"github:bahdotsh/wrkflw" = "latest"
"github:exercism/cli" = "latest"
"github:rogue-sly/dotbee" = "latest"
"github:scipenai/tylax" = "latest"
dotnet = "latest"
gh = "latest"
git-cliff = "latest"
lefthook = "latest"
odin = "latest"

[settings]
auto_install = false
auto_install_disable_tools = ["rust"]
disable_tools = ["rust"]
lockfile = true
# backends
cargo = { binstall = true, binstall_only = true }
dotnet = { cli_telemetry_optout = true, isolated = true }
pipx = { uvx = true }
