stages:
  - maintenance

squash-monthly:
  stage: maintenance
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "${GIT_USER_EMAIL:-ci@gitlab.com}"
    - git config --global user.name "${GIT_USER_NAME:-GitLab CI}"
  script: |
    echo "Starting monthly squash..."
    git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    git fetch origin main
    git checkout main
    git checkout --orphan temp-squash
    git add -A
    git commit -m "chore: monthly history squash [$(date +'%Y-%m-%d')]"
    git branch -D main
    git branch -m main
    git push origin main --force
    echo "History squashed successfully."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
